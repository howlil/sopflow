name: Generate M5 Consumer Lockfile (Temporary)
on:
  push:
    branches: [feat/playground-m5-published-consumer-20261020]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Resolve published registry versions
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts; then
              break
            fi
            if [[ "$attempt" == "15" ]]; then exit 1; fi
            sleep 8
          done
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(playground): lock published SOPFlow packages"
            git push origin HEAD:refs/heads/feat/playground-m5-published-consumer-20261020
          fi
