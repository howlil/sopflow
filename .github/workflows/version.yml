name: Version Packages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sopflow-version-pr
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open or update Version Packages PR
        uses: changesets/action/version@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm release:version
          pr-base-branch: master
          pr-title: 'chore(release): version SOPFlow packages'
          commit-message: 'chore(release): version SOPFlow packages'
