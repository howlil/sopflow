name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert registry packages are installed, not workspace linked
        run: node scripts/check-playground-npm.mjs

      - name: Regression test workspace package naming
        run: pnpm test:package-names

      - name: Check workspace
        run: pnpm check

      - name: Build Cloudflare Pages landing + nested playground
        run: |
          node scripts/build-site.mjs
          test -f apps/landing/dist/index.html
          test -f apps/landing/dist/playground/index.html
          test -f apps/landing/dist/_redirects
          grep -q 'href="/playground/"' apps/landing/dist/index.html
          grep -q '/playground/assets/' apps/landing/dist/playground/index.html

      - name: Browser smoke of production Pages routing
        run: bash scripts/check-site-browser.sh

      - name: Pack publishable packages
        run: |
          mkdir -p /tmp/sopflow-packs
          pnpm --filter @sopflow/core pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/diagram pack --pack-destination /tmp/sopflow-packs
          # Verify standalone React pack rebuilds its dist directory.
          rm -rf packages/react/dist
          pnpm --filter @sopflow/react pack --pack-destination /tmp/sopflow-packs
          ls -lah /tmp/sopflow-packs

      - name: Validate npm tarball exports and metadata
        run: node scripts/npm-release.mjs verify

      - name: Check bootstrap and OIDC CLI syntax
        run: |
          node --check scripts/npm-release.mjs
          node --check scripts/npm-bootstrap.mjs
          node --check scripts/npm-trust.mjs

      - name: Test npm registry readiness gate
        run: node --test scripts/npm-readiness.test.mjs

      - name: Check npm readiness helper syntax
        run: node --check scripts/npm-readiness.mjs

      - name: Test release tooling
        run: pnpm test:release

      - name: Browser diagram regression
        run: bash scripts/check-browser-diagrams.sh

      - name: Browser acceptance of changed source OPC renderer
        run: bash scripts/check-source-opc-browser.sh

      - name: Browser published unified workspace consumer
        run: bash scripts/check-playground-unified.sh

      - name: Upload visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sopflow-diagram-preview
          path: |
            ${{ runner.temp }}/sopflow-diagram-regression.png
            ${{ runner.temp }}/sopflow-diagram-regression.pdf
            ${{ runner.temp }}/sopflow-source-opc.png
            ${{ runner.temp }}/sopflow-source-opc.pdf
            ${{ runner.temp }}/sopflow-source-bpmn.png
            ${{ runner.temp }}/sopflow-source-bpmn.pdf
            ${{ runner.temp }}/sopflow-unified-desktop.png
            ${{ runner.temp }}/sopflow-unified-desktop.pdf
          if-no-files-found: ignore
