name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace
        run: pnpm check

      - name: Pack publishable packages
        run: |
          mkdir -p /tmp/sopflow-packs
          pnpm --filter @sopflow/core pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/diagram pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/sop-ap pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/react pack --pack-destination /tmp/sopflow-packs
          ls -lah /tmp/sopflow-packs

      - name: Browser diagram regression
        run: bash scripts/check-browser-diagrams.sh
