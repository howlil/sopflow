name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap UIArc formatting
        run: |
          pnpm exec biome check --write packages/react/src/components/arc/button/button.tsx packages/react/src/components/arc/lib/motion-tokens.ts packages/react/src/primitives/Button.uiarc.test.tsx
          for file in packages/react/src/components/arc/button/button.tsx packages/react/src/components/arc/lib/motion-tokens.ts packages/react/src/primitives/Button.uiarc.test.tsx; do
            echo "__ARC_FORMAT_BEGIN__:${file}"
            base64 -w0 "${file}"
            echo
            echo "__ARC_FORMAT_END__"
          done

      - name: Check workspace
        run: pnpm check

      - name: Pack publishable packages
        run: |
          mkdir -p /tmp/sopflow-packs
          pnpm --filter @sopflow/core pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/diagram pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/sop-ap pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/adapter-sop-ta pack --pack-destination /tmp/sopflow-packs
          # Verify standalone React pack rebuilds its dist directory.
          rm -rf packages/react/dist
          pnpm --filter @sopflow/react pack --pack-destination /tmp/sopflow-packs
          ls -lah /tmp/sopflow-packs

      - name: Browser diagram regression
        run: bash scripts/check-browser-diagrams.sh

      - name: Upload visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sopflow-diagram-preview
          path: |
            ${{ runner.temp }}/sopflow-diagram-regression.png
            ${{ runner.temp }}/sopflow-diagram-regression.pdf
          if-no-files-found: ignore
