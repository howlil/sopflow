name: Publish npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: sopflow-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.SOPFLOW_NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check current master SHA
        id: current
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$current" == "$RELEASE_SHA" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping outdated CI run: $RELEASE_SHA"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.current.outputs.valid == 'true'
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        if: steps.current.outputs.valid == 'true'
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install compatible npm CLI
        if: steps.current.outputs.valid == 'true'
        run: npm install -g npm@11.21.0
      - name: Install locked workspace dependencies
        if: steps.current.outputs.valid == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build packages
        if: steps.current.outputs.valid == 'true'
        run: pnpm -r build
      - name: Create package tarballs
        if: steps.current.outputs.valid == 'true'
        run: |
          mkdir -p /tmp/sopflow-packs
          pnpm --filter @sopflow/core pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/diagram pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/sop-ap pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/adapter-sop-ta pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/react pack --pack-destination /tmp/sopflow-packs
      - name: Validate and publish new versions
        id: publish
        if: steps.current.outputs.valid == 'true'
        env:
          SOPFLOW_NPM_PUBLISH_ENABLED: 'true'
        run: node scripts/npm-release.mjs publish

  github-release:
    needs: publish
    if: needs.publish.outputs.released != '' && needs.publish.outputs.released != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOPFLOW_RELEASED_PACKAGES: ${{ needs.publish.outputs.released }}
          SOPFLOW_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/github-releases.mjs
