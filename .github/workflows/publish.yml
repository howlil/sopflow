name: Publish npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sopflow-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.SOPFLOW_NPM_PUBLISH_ENABLED != 'false' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      id-token: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Confirm this is the current master commit
        id: current
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          current="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$current" == "$RELEASE_SHA" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping outdated or non-master commit: $RELEASE_SHA"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm CI passed for manual release
        if: github.event_name == 'workflow_dispatch' && steps.current.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          successful_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "check" and .conclusion == "success" and .app.slug == "github-actions")] | length')"
          if [[ "$successful_checks" -lt 1 ]]; then
            echo "::error::CI check has not succeeded for commit $RELEASE_SHA."
            exit 1
          fi

      - uses: actions/setup-node@v6
        if: steps.current.outputs.valid == 'true'
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Select package publishing authentication
        if: steps.current.outputs.valid == 'true'
        id: auth
        shell: bash
        env:
          NPM_KEY: ${{ secrets.NPM_KEY }}
          PREFERRED_AUTH: ${{ vars.SOPFLOW_NPM_AUTH }}
        run: |
          if [[ "$PREFERRED_AUTH" == "oidc" ]]; then
            mode="oidc"
          elif [[ "$PREFERRED_AUTH" == "token" ]]; then
            if [[ -z "$NPM_KEY" ]]; then
              echo "::error::SOPFLOW_NPM_AUTH=token but GitHub Actions secret NPM_KEY is missing."
              exit 1
            fi
            mode="token"
          elif [[ -n "$NPM_KEY" ]]; then
            mode="token"
          else
            mode="oidc"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Publishing authentication selected: $mode"
          if [[ "$mode" == "token" ]]; then
            echo "::notice::Using a short-lived npm granular token. Direct token publishing is being deprecated in January 2027; migrate to OIDC."
          fi

      - name: Check first-publish registry status
        if: steps.current.outputs.valid == 'true'
        id: bootstrap
        run: node scripts/npm-readiness.mjs

      - name: Require a credential for initial package publishing
        if: steps.current.outputs.valid == 'true'
        shell: bash
        env:
          READY: ${{ steps.bootstrap.outputs.ready }}
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
        run: |
          if [[ "$READY" != "true" && "$AUTH_MODE" != "token" ]]; then
            echo "::error::Some @sopflow packages do not exist. Configure NPM_KEY with package/scope Read and Write (publish and stage) + Bypass 2FA, or publish these packages once interactively."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        if: steps.current.outputs.valid == 'true'
        with:
          version: 11.21.0

      - name: Install npm CLI compatible with OIDC
        if: steps.current.outputs.valid == 'true'
        run: |
          npm install -g npm@11.21.0
          node --version
          npm --version

      - name: Validate npm token account without exposing the key
        if: steps.current.outputs.valid == 'true' && steps.auth.outputs.mode == 'token'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
        run: |
          account="$(npm whoami --registry=https://registry.npmjs.org/)"
          if [[ "$account" != "howlilabs" ]]; then
            echo "::error::NPM_KEY belongs to $account, expected howlilabs."
            exit 1
          fi
          echo "npm token authenticated as howlilabs."

      - name: Install locked workspace dependencies
        if: steps.current.outputs.valid == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        if: steps.current.outputs.valid == 'true'
        run: pnpm -r build

      - name: Create npm tarballs in dependency order
        if: steps.current.outputs.valid == 'true'
        run: |
          mkdir -p /tmp/sopflow-packs
          pnpm --filter @sopflow/core pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/diagram pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/react pack --pack-destination /tmp/sopflow-packs

      - name: Validate and publish missing package versions
        if: steps.current.outputs.valid == 'true'
        id: publish
        shell: bash
        env:
          SOPFLOW_NPM_PUBLISH_ENABLED: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
          PUBLISH_AUTH_MODE: ${{ steps.auth.outputs.mode }}
          NPM_KEY: ${{ secrets.NPM_KEY }}
        run: |
          if [[ "$PUBLISH_AUTH_MODE" == "token" ]]; then
            if [[ -z "$NPM_KEY" ]]; then
              echo "::error::NPM_KEY is missing."
              exit 1
            fi
            export NODE_AUTH_TOKEN="$NPM_KEY"
          else
            unset NODE_AUTH_TOKEN
            if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
              echo "::error::GitHub OIDC is unavailable: id-token write permission is required."
              exit 1
            fi
          fi
          unset NPM_KEY
          node scripts/npm-release.mjs publish

  github-release:
    needs: publish
    if: needs.publish.outputs.released != '' && needs.publish.outputs.released != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOPFLOW_RELEASED_PACKAGES: ${{ needs.publish.outputs.released }}
          SOPFLOW_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/github-releases.mjs
