name: Publish npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sopflow-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.SOPFLOW_NPM_PUBLISH_ENABLED != 'false' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      id-token: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Confirm this is the current master commit
        id: current
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          current="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$current" == "$RELEASE_SHA" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping outdated or non-master commit: $RELEASE_SHA"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm CI passed for manual release
        if: github.event_name == 'workflow_dispatch' && steps.current.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          successful_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "check" and .conclusion == "success" and .app.slug == "github-actions")] | length')"
          if [[ "$successful_checks" -lt 1 ]]; then
            echo "::error::CI check has not succeeded for commit $RELEASE_SHA."
            exit 1
          fi

      - uses: actions/setup-node@v6
        if: steps.current.outputs.valid == 'true'
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check first-publish bootstrap status
        if: steps.current.outputs.valid == 'true'
        id: bootstrap
        run: node scripts/npm-readiness.mjs

      - uses: pnpm/action-setup@v4
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          version: 11.21.0

      - name: Install supported npm CLI for OIDC
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          npm install -g npm@11.21.0
          node --version
          npm --version

      - name: Install locked workspace dependencies
        if: steps.bootstrap.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        if: steps.bootstrap.outputs.ready == 'true'
        run: pnpm -r build

      - name: Create npm tarballs in dependency order
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          mkdir -p /tmp/sopflow-packs
          pnpm --filter @sopflow/core pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/diagram pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/sop-ap pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/adapter-sop-ta pack --pack-destination /tmp/sopflow-packs
          pnpm --filter @sopflow/react pack --pack-destination /tmp/sopflow-packs

      - name: Validate and publish through npm OIDC
        if: steps.bootstrap.outputs.ready == 'true'
        id: publish
        env:
          SOPFLOW_NPM_PUBLISH_ENABLED: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Remove NODE_AUTH_TOKEN. SOPFlow releases must use npm OIDC, not long-lived tokens."
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::GitHub OIDC unavailable: id-token write permission is required."
            exit 1
          fi
          node scripts/npm-release.mjs publish

  github-release:
    needs: publish
    if: needs.publish.outputs.released != '' && needs.publish.outputs.released != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOPFLOW_RELEASED_PACKAGES: ${{ needs.publish.outputs.released }}
          SOPFLOW_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/github-releases.mjs
